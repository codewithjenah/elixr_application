name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  elixr_core:
    name: elixr_core checks
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: packages/elixr_core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install elixr_core dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run elixr_core tests
        run: flutter test

  legacy_coaching_provenance:
    name: legacy_coaching_provenance checks
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: scripts/legacy_coaching_provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Dart version
        run: dart --version

      - name: Install package dependencies
        run: dart pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Dart analyzer
        run: dart analyze

      - name: Run package tests
        run: dart test

  backend:
    name: Backend checks
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Verify critical imports
        run: python -c "import cv2, mediapipe, numpy, ultralytics, comtypes, onnxruntime as ort; assert 'DmlExecutionProvider' in ort.get_available_providers(), ort.get_available_providers()"

      - name: Run backend tests
        run: python -m pytest -q tests

      - name: Compile backend Python files
        run: python -m compileall .

  macos_arm64:
    name: macOS arm64 build and DMG
    # macos-15 is a GitHub-hosted Apple Silicon (arm64) image.
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm native arm64 host
        run: test "$(uname -m)" = arm64

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run platform-affected Flutter tests
        run: >-
          flutter test
          test/services/backend_service_test.dart
          test/services/backend_runtime_test.dart
          test/services/desktop_google_oauth_flow_test.dart
          test/services/join_link_service_test.dart
          test/core/widgets/elixr_video_controller_test.dart
          test/services/settings_service_persist_test.dart

      - name: Set up Python 3.11 (arm64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Build backend, app, and DMG
        env:
          PYTHON: python3.11
        run: bash scripts/build_macos_release.sh

      - name: Smoke-test the frozen backend health endpoint
        # The copy inside ELIXR.app is signed app-sandbox + inherit, so macOS
        # traps it (SIGTRAP) unless the sandboxed ELIXR app is its parent; the
        # next step covers that copy. This runs the identical frozen payload.
        run: |
          BACKEND="build/macos-release/backend-dist/elixr_backend/elixr_backend"
          "$BACKEND" --host 127.0.0.1 --port 18765 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18765/health | grep -q '"ok"'; then
              echo "health ok after ${i}s"
              listeners="$(lsof -nP -a -p "$pid" -iTCP -sTCP:LISTEN -Fn | sed -n 's/^n//p' | sort -u)"
              echo "listeners: $listeners"
              test "$listeners" = "127.0.0.1:18765" || { echo "unexpected listeners"; exit 1; }
              exit 0
            fi
            kill -0 "$pid" 2>/dev/null || { echo "frozen backend exited before health"; exit 1; }
            sleep 1
          done
          echo "frozen backend health timed out"; exit 1

      - name: Launch app and confirm sidecar health and cleanup
        run: |
          APP="build/macos-release/dmg-stage/ELIXR.app"
          "$APP/Contents/MacOS/ELIXR" &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; pkill -f "ELIXR.app/Contents/Resources/backend/elixr_backend" || true' EXIT
          sidecar=""
          for i in $(seq 1 90); do
            sidecar="$(pgrep -P "$app_pid" -f elixr_backend || true)"
            [ -n "$sidecar" ] && break
            kill -0 "$app_pid" 2>/dev/null || { echo "ELIXR exited during startup"; exit 1; }
            sleep 1
          done
          test -n "$sidecar" || { echo "ELIXR did not start its sidecar"; exit 1; }
          ps -o pid=,ppid=,command= -p "$sidecar"
          port=""
          for i in $(seq 1 60); do
            port="$(lsof -nP -a -p "$sidecar" -iTCP -sTCP:LISTEN -Fn | sed -n 's/^n127\.0\.0\.1://p' | head -1)"
            if [ -n "$port" ] && curl -fsS "http://127.0.0.1:$port/health" | grep -q '"ok"'; then
              echo "bundled sidecar healthy on 127.0.0.1:$port after ${i}s"; break
            fi
            port=""
            kill -0 "$sidecar" 2>/dev/null || { echo "sidecar exited before health"; exit 1; }
            sleep 1
          done
          test -n "$port" || { echo "bundled sidecar never became healthy"; exit 1; }
          # The app hands the sidecar its free-port probe result and its pid.
          ps -o command= -p "$sidecar" | grep -q -- "--host 127.0.0.1 --port $port --parent-pid $app_pid" \
            || { echo "sidecar was not started with the dynamic loopback endpoint"; exit 1; }
          listeners="$(lsof -nP -a -p "$sidecar" -iTCP -sTCP:LISTEN -Fn | sed -n 's/^n//p' | sort -u)"
          test "$listeners" = "127.0.0.1:$port" || { echo "unexpected listeners: $listeners"; exit 1; }
          kill "$app_pid"; wait "$app_pid" || true
          for i in $(seq 1 15); do
            if ! kill -0 "$sidecar" 2>/dev/null; then
              echo "sidecar exited ${i}s after ELIXR exited"; trap - EXIT; exit 0
            fi
            sleep 1
          done
          echo "sidecar still running after app exit"; exit 1

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ELIXR-macOS-arm64
          path: build/macos-release/ELIXR-macOS-arm64.dmg
          if-no-files-found: error
